<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio of a full-stack developer" />
    <link rel="icon" type="image/webp" href="/images/deni.webp" />
    <!-- Perf: font tidak lagi via @import di CSS (render-blocking berantai).
         Preconnect + display=swap mempercepat FCP/LCP tanpa ubah tampilan. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <!-- Logo TechStack dari CDN yang sama — preconnect hemat TLS berulang. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- LCP mobile = foto profil sidebar: preload agar tidak antre. -->
    <link
      rel="preload"
      as="image"
      href="/profil.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <title>Deni Purwanto — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Terapkan mode gelap/terang tersimpan sebelum React render
      // supaya tema tidak "flash" ke default dulu.
      try {
        var savedTheme = window.localStorage.getItem('portfolio-theme');
        var theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <script>
      // Terapkan aksen tersimpan sebelum React render
      // supaya warna tidak "flash" ke default dulu.
      try {
        var saved = window.localStorage.getItem('portfolio-accent');
        var valid = ['default', 'ocean', 'emerald', 'violet', 'orange', 'rose'];
        if (valid.indexOf(saved) !== -1) {
          document.documentElement.setAttribute('data-accent', saved);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
